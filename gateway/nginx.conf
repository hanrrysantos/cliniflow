events {}

http {
  upstream api {
    server api:3000;
  }

  limit_req_zone $binary_remote_addr zone=por_ip:10m rate=20r/s;

  server {
    listen 80;

    location / {
      limit_req zone=por_ip burst=40 nodelay;

      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;

      proxy_connect_timeout 2s;
      proxy_read_timeout 6s;
      proxy_next_upstream error timeout http_502;
    }
  }
}
