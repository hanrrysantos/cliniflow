x-env: &env
  DATABASE_URL: postgres://cliniflow:cliniflow@postgres:5432/cliniflow
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cliniflow
      POSTGRES_PASSWORD: cliniflow
      POSTGRES_DB: cliniflow
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cliniflow"]
      interval: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  localstack:
    image: localstack/localstack:2026.10
    ports:
      - "4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      S3_SKIP_SIGNATURE_VALIDATION: "0"
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD", "awslocal", "s3api", "head-bucket", "--bucket", "cliniflow-miniaturas"]
      interval: 5s
      retries: 30

  api:
    build: .
    command: ["node", "src/app.js"]
    environment:
      <<: *env
      S3_ENDPOINT: http://localstack:4566
      S3_PUBLIC_ENDPOINT: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      BUCKET_ORIGINAIS: cliniflow-originais
      BUCKET_MINIATURAS: cliniflow-miniaturas
      WORKER_URL: http://localhost:8787
      FOTO_TIMEOUT_SEGUNDOS: ${FOTO_TIMEOUT_SEGUNDOS:-300}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      replicas: 2

  worker:
    build: .
    command: ["node", "src/worker.js"]
    environment: *env
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped
