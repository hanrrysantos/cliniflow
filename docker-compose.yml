x-env: &env
  DATABASE_URL: postgres://cliniflow:cliniflow@postgres:5432/cliniflow
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cliniflow
      POSTGRES_PASSWORD: cliniflow
      POSTGRES_DB: cliniflow
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cliniflow"]
      interval: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  # Instala as dependências da Lambda em Linux (o sharp é nativo) num volume, sem tocar no node_modules do host.
  empacotador:
    image: node:22-bookworm-slim
    working_dir: /pacote
    command: ["sh", "-c", "rm -rf /pacote/* && cp /src/handler.js /src/servico-imagens.js /src/armazenamento.js /src/package.json /src/package-lock.json /pacote/ && npm ci --omit=dev --no-audit --no-fund"]
    volumes:
      - ./serverless/processador-imagens:/src:ro
      - pacote-lambda:/pacote

  localstack:
    image: localstack/localstack:2026.10
    ports:
      - "4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      S3_SKIP_SIGNATURE_VALIDATION: "0"
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d:ro
      - ./localstack/shutdown:/etc/localstack/init/shutdown.d:ro
      - ./localstack/dados:/var/lib/cliniflow-backup # backup dos buckets entre reinícios (Hobby não tem persistência)
      - pacote-lambda:/opt/processador-imagens:ro
      - /var/run/docker.sock:/var/run/docker.sock # a Lambda roda em containers criados pelo LocalStack
    depends_on:
      empacotador: { condition: service_completed_successfully }
    stop_grace_period: 30s # tempo para o shutdown.d copiar os buckets
    healthcheck:
      # pronto só quando TODOS os scripts de init terminaram (buckets, backup, Lambda e gatilho)
      test: ["CMD-SHELL", "curl -sf localhost:4566/_localstack/init/ready | grep -q '\"completed\": *true'"]
      interval: 5s
      retries: 30

  api:
    build: .
    command: ["node", "src/app.js"]
    environment:
      <<: *env
      S3_ENDPOINT: http://localstack:4566
      S3_PUBLIC_ENDPOINT: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      BUCKET_ORIGINAIS: cliniflow-originais
      BUCKET_MINIATURAS: cliniflow-miniaturas
      WORKER_URL: http://localhost:8787
      FOTO_TIMEOUT_SEGUNDOS: ${FOTO_TIMEOUT_SEGUNDOS:-300}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      replicas: 2

  worker:
    build: .
    command: ["node", "src/worker.js"]
    environment: *env
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html/app:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pacote-lambda:
